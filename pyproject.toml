[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mpra-predictor"
version = "0.1.0"
description = "MPRA prediction model and analysis code"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
  {name = "Joseph Finkelberg", email = "joseff@bu.edu"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

# DEPENDENCIES
dependencies = [
    # Core Data Handling
    "numpy>=1.24.0",
    "pandas>=2.0.0",  # required by logomaker
    "polars>=1.33.1",
    "h5py>=3.8.0",

    # Machine Learning & Stats
    "torch>=2.8.0",
    "lightgbm>=4.6.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.10.0",

    # Visualization
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "logomaker>=0.8",

    # Utilities
    "tqdm>=4.65.0",
]

[project.urls]
"Homepage" = "https://github.com/osyafinkelberg/mpra-predictor"

[project.optional-dependencies]
dev = [
    "jupyterlab",
    "black",
    "pytest"
]
